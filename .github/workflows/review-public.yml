# AI code review for PUBLIC repos, on GitHub-hosted `ubuntu-latest` (free for
# public repos). PR-Agent posts the review; Claude, via the org's
# ANTHROPIC_API_KEY, writes it.
#
# Twin of review-private.yml: keep the two identical apart from `runs-on` and
# the job's `if`. Steps aren't factored into a composite action on purpose: a
# local action needs the PR's code checked out on the runner, and this job
# needs no checkout at all (PR-Agent reads the diff through the GitHub API).
name: AI review (public)

on:
  pull_request:
    # synchronize re-reviews each push (PR-Agent updates its one review
    # comment rather than adding another). Affordable on Haiku 5.5; the
    # original "no synchronize" rule was about volume under per-seat pricing.
    types: [opened, ready_for_review, synchronize]
  issue_comment:
    # A PR comment starting with "/" (e.g. /review, /describe, /improve)
    # re-runs PR-Agent on demand. Gated below to people with write access.
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Comment runs only. A comment event doesn't say whether the PR comes from
  # a fork, and author_association counts read-only collaborators, so ask the
  # API: the PR's head must be this repo and the commenter must have write
  # access. Runs on GitHub-hosted, so nothing reaches the review job's runner
  # until this passes.
  comment-gate:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.repository.private == false &&
      github.event.issue.pull_request &&
      github.event.sender.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.repo.full_name)
          perm=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission)
          echo "PR head: $head; $COMMENTER has: $perm"
          if [ "$head" = "$REPO" ] && { [ "$perm" = admin ] || [ "$perm" = write ]; }; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: comment-gate
    # Public repos only; private ones are reviewed by review-private.yml on
    # the self-hosted runner. Fork PRs are skipped: `pull_request` from a fork
    # gets no secrets, so the review couldn't reach the model anyway (and
    # `pull_request_target`, which would have secrets, isn't worth its risk).
    # Comment runs do get secrets, so they're limited to "/" commands from
    # people with write access: anyone can comment on a public repo.
    # always(): run even though comment-gate is skipped for pull_request events.
    if: >-
      always() &&
      github.event.repository.private == false && (
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.draft == false &&
         (github.event.action != 'synchronize' || github.event.sender.type != 'Bot')) ||
        (github.event_name == 'issue_comment' &&
         needs.comment-gate.outputs.ok == 'true')
      )
    # Job-level, so a comment that doesn't qualify, or a bot push (which
    # PR-Agent would ignore anyway), has its job skipped and never joins the
    # group, and so can't cancel a review in progress. Per PR number: a
    # comment run's ref is the default branch.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: PR-Agent review
        # PR-Agent v0.50.0 (github.com/The-PR-Agent/pr-agent, formerly
        # qodo-ai/pr-agent), its GitHub Action image pinned by digest. The
        # action wrapper's Dockerfile pulls a rolling tag, so pinning the
        # wrapper's commit wouldn't pin what runs; the project's SECURITY.md
        # recommends this form. Multi-arch (amd64 + arm64). Provenance: built
        # by The-PR-Agent/pr-agent .github/workflows/publish.yml at v0.50.0.
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC__KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Haiku 5.5. On real PRs replayed through PR-Agent (2026-11), Haiku with
          # the review settings below beat DeepSeek V4.1 Flash and GLM-5.3-Flash.
          # Retuning the settings mattered more than the model choice
          # (project-template docs/research/2026-11-18-review-model-options.md).
          config.model: "anthropic/claude-haiku-5-5"
          # PR-Agent's default fallback is an OpenAI model; there's no OpenAI key.
          config.fallback_models: "[]"
          # PR-Agent's request budget (diff + its prompt + the reply reserve)
          # defaults to 32k and clips the diff past it, so large PRs were
          # reviewed in part (soot#24 skipped whole files). The reply reserve
          # is config.max_output_tokens below, so raise this with it: 160k is
          # 128k of diff room plus the 32k reply cap (project-template#77).
          # Cost: Haiku 5.5 is $0.10/$0.50 per MTok, but a request whose prompt
          # passes 100k tokens bills entirely at 5x. PR-Agent's count runs about
          # 1.5x under Anthropic's (58,890 counted vs 88,727 billed), so a diff
          # it counts above ~65k is billed at the higher rate. Measured with
          # these settings: ~$0.003 on a ~20k-token diff and ~$0.015 on a ~90k
          # one. A diff filling the budget costs ~$0.13. Rare enough to accept:
          # a smaller budget forces chunking, which cost the reviews cross-file
          # context and produced false findings.
          config.max_model_tokens: "160000"
          # Reply cap. Unset, litellm sends Anthropic's 4,096, and PR-Agent drops
          # a truncated reply, so the check failed with an empty
          # "finish_reason: length" (message-me#1). With thinking on, a
          # large review used ~13k (thinking included), so this leaves headroom.
          # Billed per token used, not per token allowed.
          config.max_output_tokens: "32000"
          # Overflow only: if a diff still doesn't fit the budget, review it in
          # up to 3 calls and merge the results, rather than skipping files.
          pr_reviewer.enable_large_pr_chunking: "true"
          # PR-Agent's default of 3 findings capped every review, so a big PR
          # got the same 3 at most. With 8, reviews aren't padded: most still
          # report 1-4 findings.
          pr_reviewer.num_max_findings: "8"
          # Adaptive thinking, at PR-Agent's default effort (medium). Off by
          # default in PR-Agent.
          config.enable_claude_adaptive_thinking: "true"
          # Topics the review should check. In testing these did most of the
          # work: 6 real bugs found, against 1 without them, with 80% of
          # findings real.
          pr_reviewer.extra_instructions: >-
            Also check, where the diff touches them: shell quoting and word
            splitting, set -e/-u pitfalls, inverted or off-by-one conditions,
            checks that should fail closed but fail open, GitHub Actions
            trigger/permission/secret exposure, authorization checks that test
            the wrong thing, data or privacy leaks to the wrong audience, races
            and concurrency, and docs or comments that contradict the code.
            Report each distinct real problem; do not merge unrelated problems
            into one finding.
          # Review only. describe would rewrite the PR description and improve
          # adds a second model call per PR; turn them on here if wanted.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "ready_for_review"]'
          # On synchronize, re-run /review (merge commits and bot pushes skipped).
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'
          # Measurement while per-review cost is unknown: append model, tokens,
          # time and estimated cost to each review comment. Turn off once known.
          config.output_run_details: "true"
          config.output_run_cost: "true"
